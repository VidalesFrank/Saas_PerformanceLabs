services:

  # ── Base de datos ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: performancelabs
      POSTGRES_USER: ${POSTGRES_USER:-plabs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Debes definir POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plabs} -d ${POSTGRES_DB:-performancelabs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache / Cola de tareas ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── API (FastAPI + migraciones automáticas) ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plabs}:${POSTGRES_PASSWORD}@postgres:5432/performancelabs
      JWT_SECRET: ${JWT_SECRET:?Debes definir JWT_SECRET en .env}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://${SERVER_HOST:-localhost}:7000"]'
      BASE_DATA_DIR: /app/data
      RUN_MIGRATIONS: "true"
    volumes:
      - api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Worker Celery (análisis no lineal 3D) ───────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plabs}:${POSTGRES_PASSWORD}@postgres:5432/performancelabs
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379/0
      BASE_DATA_DIR: /app/data
      RUN_MIGRATIONS: "false"
    volumes:
      - api_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Frontend (Next.js standalone) ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # ── Reverse proxy ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "7000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:
  api_data:
